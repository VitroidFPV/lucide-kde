name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run pack
      - name: Check generated theme
        run: |
          git status --short -- theme/Lucide-KDE
          test -z "$(git status --porcelain -- theme/Lucide-KDE)"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: Lucide-KDE-preview
          path: dist/Lucide-KDE.tar.gz
          if-no-files-found: error
